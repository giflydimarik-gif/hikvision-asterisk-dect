name: Indoor notifications (offline)
on:
  push:
    paths: ['indoor-notifications/**', '.github/workflows/indoor-notifications.yml']
  pull_request:
    paths: ['indoor-notifications/**', '.github/workflows/indoor-notifications.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pictures.txt
        working-directory: indoor-notifications
      - run: python -B -W error::ResourceWarning -m unittest discover -s tests -v
        working-directory: indoor-notifications
