; Example of the DECT/SIP endpoint used in the working setup.
; Use a strong unique password in the real configuration.

[101]
type=endpoint
context=internal
callerid="Home 1" <101>
disallow=all
allow=alaw
allow=ulaw
auth=auth101
aors=101
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth101]
type=auth
auth_type=userpass
username=101
password=<DECT_SIP_PASSWORD>

[101]
type=aor
max_contacts=1
remove_existing=yes
