; Hikvision indoor SIP bridge
; Replace <HIKVISION_INDOOR_IP> with your indoor monitor / indoor SIP peer IP.

[hikvision-indoor]
type=aor
contact=sip:10000000005@<HIKVISION_INDOOR_IP>:5060

[hikvision-indoor]
type=endpoint
context=hikvision-indoor-in
disallow=all
allow=ulaw
allow=alaw
allow=h264
aors=hikvision-indoor
direct_media=no
rtp_symmetric=no
force_rport=yes
rewrite_contact=yes

; Critical for the tested Hikvision media path.
rtp_port_start=9654
rtp_port_end=9656

[hikvision-indoor]
type=identify
endpoint=hikvision-indoor
match=<HIKVISION_INDOOR_IP>
